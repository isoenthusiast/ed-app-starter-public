name: Import sanitized public source
on:
  push:
    paths: ['.github/workflows/import-public.yml']
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'isoenthusiast/ed-app-starter-public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import checksum-verified source
        run: |
          test ! -f package.json || { echo 'Already imported'; exit 0; }
          echo 'c8c7aad2975c3623f88d68b4857e4e3143a5427c9aeb2f318ea794e595d2cd67  public-source.zip' | sha256sum --check
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('public-source.zip') as archive:
              for item in archive.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] != '.github'
                  destination = pathlib.Path(path)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(item))
          pathlib.Path('public-source.zip').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import audited template, starter pack and beginner deployment guide'
          git push
